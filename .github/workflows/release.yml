name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD secret"; exit 1; }

      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > release.jks

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare release asset
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          clean_tag="${tag#v}"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/YomiLLM-${tag}.apk"
          sha256sum "release/YomiLLM-${tag}.apk" > "release/YomiLLM-${tag}.apk.sha256"
          python3 -c "
          import re
          try:
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  text = f.read()
              match = re.search(r'## \[' + re.escape('$clean_tag') + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)', text, re.DOTALL)
              if match:
                  with open('release/RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
                      out.write(match.group(1).strip())
          except Exception as e:
              pass
          "

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YomiLLM-release
          path: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release/RELEASE_NOTES.md
          overwrite: true
          generate_release_notes: false
